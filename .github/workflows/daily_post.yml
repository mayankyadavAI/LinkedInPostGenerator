name: Daily LinkedIn Post

on:
  schedule:
    # Once daily at 10:03 AM IST (4:33 AM UTC) — business use case + AWS architecture diagram
    - cron: '33 4 * * *'
  workflow_dispatch:
    inputs:
      content_slot:
        description: 'Content slot: business_usecase | news | educational | personal | advanced'
        required: false
        default: 'business_usecase'
      topic:
        description: 'Force an exact topic string — leave blank for dynamic ideation (business_usecase) or random (other slots)'
        required: false
        default: ''
      preview:
        description: 'Preview only — do not publish to LinkedIn'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Graphviz is required by the diagrams library for AWS architecture rendering
          sudo apt-get install -y graphviz graphviz-dev
          # Cairo/Pango retained for Matplotlib/Manim fallback
          sudo apt-get install -y build-essential python3-dev pkg-config \
            libcairo2-dev libpango1.0-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p renderer/output

      - name: Detect content slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.content_slot }}" >> $GITHUB_OUTPUT
          else
            # Scheduled runs always use business_usecase
            echo "slot=business_usecase" >> $GITHUB_OUTPUT
          fi

      - name: Verify required secrets
        run: |
          missing=""
          [ -z "$GEMINI_API_KEY" ]        && missing="$missing GEMINI_API_KEY"
          [ -z "$LINKEDIN_ACCESS_TOKEN" ] && missing="$missing LINKEDIN_ACCESS_TOKEN"
          [ -z "$LINKEDIN_PERSON_ID" ]    && missing="$missing LINKEDIN_PERSON_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Go to Settings → Secrets and variables → Actions and add them."
            exit 1
          fi
          # EXA_API_KEY only required for non-business_usecase slots
          if [ "${{ steps.slot.outputs.slot }}" != "business_usecase" ]; then
            [ -z "$EXA_API_KEY" ] && echo "::warning::EXA_API_KEY not set — Exa research will be skipped."
          fi
          echo "All required secrets present."
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID:    ${{ secrets.LINKEDIN_PERSON_ID }}
          EXA_API_KEY:           ${{ secrets.EXA_API_KEY }}

      - name: Generate and post to LinkedIn
        run: |
          PREVIEW_FLAG=""
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then
            PREVIEW_FLAG="--preview"
          fi
          python scripts/generate_and_schedule.py $PREVIEW_FLAG
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:       ${{ secrets.GEMINI_API_KEY_2 }}
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          EXA_API_KEY:            ${{ secrets.EXA_API_KEY }}
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID:     ${{ secrets.LINKEDIN_PERSON_ID }}
          CONTENT_SLOT:           ${{ steps.slot.outputs.slot }}
          INCLUDE_INFOGRAPHIC:    "1"
          TOPIC_OVERRIDE:         ${{ github.event.inputs.topic }}

      - name: Upload generated diagram
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-diagram-${{ github.run_id }}
          path: renderer/output/*.png
          if-no-files-found: ignore
          retention-days: 14
