name: Daily LinkedIn Post

on:
  schedule:
    - cron: '33 4 * * *'   # 10:03 AM IST — Breaking AI news / hot take
    - cron: '27 7 * * *'   # 12:57 PM IST — AI educational post
    - cron: '17 12 * * *'  # 5:47 PM IST  — Personal learning / build-in-public
    - cron: '43 16 * * *'  # 10:13 PM IST — Advanced AI concept
  workflow_dispatch:
    inputs:
      content_slot:
        description: 'Content slot: news | educational | personal | advanced | business_usecase'
        required: false
        default: 'news'
      topic:
        description: 'Force an exact topic string (must match one in topics.json) — leave blank for random'
        required: false
        default: ''
      preview:
        description: 'Preview only — do not publish to LinkedIn'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libcairo2-dev libpango1.0-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create infographic output dir
        run: mkdir -p renderer/output

      - name: Detect content slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.content_slot }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "33 4 * * *")  echo "slot=news"        >> $GITHUB_OUTPUT ;;
              "27 7 * * *")  echo "slot=educational" >> $GITHUB_OUTPUT ;;
              "17 12 * * *") echo "slot=personal"    >> $GITHUB_OUTPUT ;;
              "43 16 * * *") echo "slot=advanced"    >> $GITHUB_OUTPUT ;;
              *)             echo "slot=news"         >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Verify required secrets are present
        run: |
          missing=""
          [ -z "$GEMINI_API_KEY" ]        && missing="$missing GEMINI_API_KEY"
          [ -z "$EXA_API_KEY" ]           && missing="$missing EXA_API_KEY"
          [ -z "$LINKEDIN_ACCESS_TOKEN" ] && missing="$missing LINKEDIN_ACCESS_TOKEN"
          [ -z "$LINKEDIN_PERSON_ID" ]    && missing="$missing LINKEDIN_PERSON_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Go to Settings → Secrets and variables → Actions and add them."
            exit 1
          fi
          echo "All required secrets are present."
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY:           ${{ secrets.EXA_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID:    ${{ secrets.LINKEDIN_PERSON_ID }}

      - name: Generate and post to LinkedIn
        run: |
          PREVIEW_FLAG=""
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then
            PREVIEW_FLAG="--preview"
          fi
          python scripts/generate_and_schedule.py $PREVIEW_FLAG
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:       ${{ secrets.GEMINI_API_KEY_2 }}
          DEEPSEEK_API_KEY:       ${{ secrets.DEEPSEEK_API_KEY }}
          EXA_API_KEY:            ${{ secrets.EXA_API_KEY }}
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID:     ${{ secrets.LINKEDIN_PERSON_ID }}
          CONTENT_SLOT:           ${{ steps.slot.outputs.slot }}
          INCLUDE_INFOGRAPHIC:    "1"
          TOPIC_OVERRIDE:         ${{ github.event.inputs.topic }}

      - name: Upload generated infographic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infographic-${{ github.run_id }}
          path: renderer/output/*.png
          if-no-files-found: ignore
          retention-days: 14
